name: release

# Any new tag, on any branch: test, build dab.exe and publish it as a downloadable GitHub release.
on:
  push:
    tags: ["**"]

permissions:
  contents: write  # create the release and upload the asset

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]" pyinstaller
      - run: ruff check dab tests
      - run: python -m pytest
      - name: Build dab.exe
        shell: cmd
        run: build.cmd
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/dab.exe
          generate_release_notes: true
