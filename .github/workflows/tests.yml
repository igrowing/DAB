name: tests

# Every commit pushed to any branch. Tag pushes are handled by release.yml, which runs the same checks first.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest  # the project targets Windows 11 only (registry, schtasks)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check dab tests
      - run: python -m pytest
